<!DOCTYPE html>
<html>
<head>
<title>High Scorers</title>
</head>
<body>
<h1>High Scorers - 80 or Above</h1>

{{ student.marks }} -

{% endfor %}
<a href="{% url 'home' %}">Home</a>
</body>
</html>
